baseURL = "https://fitmetrics.net/"
languageCode = "en-us"
title = "FitMetrics"

[params]
  description = "Evidence-based health and fitness calculators — BMR, macros, heart rate zones, and more."
  author = "Matt Wick, MD"
  authorCredential = "Board-certified in Family Medicine"
  authorBio = "Matt Wick, MD earned his medical degree from the University of Pittsburgh and is board certified in family medicine. He completed the Institute for Functional Medicine's Applying Functional Medicine in Clinical Practice (AFMCP) program. He founded FitMetrics to put clinically validated health metrics into people's hands in a form that's easy to understand and act on."

